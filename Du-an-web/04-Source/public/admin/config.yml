# Decap CMS — Mekong Sling
# LƯU Ý: mọi path tính từ GỐC REPO (git root = c:\Mekong), nên có tiền tố
# "Du-an-web/04-Source/". Đổi base_url sang domain thật khi mekongsling.com live.

backend:
  name: github
  repo: slingmekong-del/MKWEB
  branch: main
  base_url: https://mkweb-alpha.vercel.app
  auth_endpoint: api/auth
  commit_messages:
    create: "CMS: thêm {{collection}} “{{slug}}”"
    update: "CMS: sửa {{collection}} “{{slug}}”"
    delete: "CMS: xóa {{collection}} “{{slug}}”"
    uploadMedia: "CMS: tải ảnh {{path}}"
    deleteMedia: "CMS: xóa ảnh {{path}}"

# Cho phép test tại chỗ bằng `npx decap-server` (chạy từ GỐC REPO c:\Mekong).
local_backend: true

# Ảnh sản phẩm mặc định → public/products (URL /products/...).
media_folder: "Du-an-web/04-Source/public/products"
public_folder: "/products"

collections:
  # ─────────────────────────────  SẢN PHẨM  ─────────────────────────────
  - name: products
    label: "Sản phẩm"
    label_singular: "Sản phẩm"
    identifier_field: name
    folder: "Du-an-web/04-Source/content/products"
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{fields.id}}"
    summary: "#{{fields.no}} · {{fields.name}} · {{fields.status}}"
    sortable_fields: [no, name, status, brand]
    editor:
      preview: false
    view_filters:
      - label: "Đang hiển thị trên web"
        field: hidden
        pattern: false
      - label: "Đang ẩn"
        field: hidden
        pattern: true
      - label: "Live"
        field: status
        pattern: live
      - label: "Coming soon"
        field: status
        pattern: coming
    fields:
      - { name: id, label: "ID / slug URL (KHÔNG đổi sau khi tạo)", widget: string, hint: "vd: green-pin-bow-shackle-sc-g-4161 — chữ thường, gạch nối, không dấu" }
      - { name: no, label: "Số thứ tự (catalogue)", widget: number, value_type: int, default: 99 }
      - { name: rank, label: "Rank (ưu tiên trong danh mục)", widget: number, value_type: int, required: false, default: 1 }
      - { name: name, label: "Tên sản phẩm", widget: string }
      - { name: partNo, label: "Part No.", widget: string, required: false }
      - name: brand
        label: "Thương hiệu"
        widget: relation
        required: false
        collection: settings
        file: brands
        search_fields: ["brands.*.label"]
        value_field: "brands.*.label"
        display_fields: ["brands.*.label"]
        hint: "Chọn thương hiệu. Thêm/xóa thương hiệu ở Cài đặt → Thương hiệu."
      - name: categoryId
        label: "Danh mục"
        widget: relation
        collection: settings
        file: categories
        search_fields: ["categories.*.label"]
        value_field: "categories.*.id"
        display_fields: ["categories.*.label"]
        hint: "Chọn 1 danh mục — tên hiển thị tự lấy theo danh mục này."
      # category & categoryLabel được suy tự động từ categoryId khi build; giữ
      # ở đây (hidden) để Decap không xóa mất khi lưu.
      - { name: category, label: "category (tự động)", widget: hidden }
      - { name: categoryLabel, label: "categoryLabel (tự động)", widget: hidden }
      - { name: subcategory, label: "Nhóm phụ (subcategory)", widget: string, required: false }
      - name: status
        label: "Trạng thái"
        widget: select
        options:
          - { label: "Live — bán/hiển thị đầy đủ", value: live }
          - { label: "Coming soon — đang cập nhật", value: coming }
        default: coming
      - { name: hidden, label: "Ẩn hoàn toàn khỏi website", widget: boolean, default: false, hint: "Bật = gỡ khỏi danh sách, tìm kiếm, sitemap và trang chi tiết (404)." }
      - { name: wText, label: "WLL / dải tải (chữ hiển thị)", widget: string, required: false, hint: "vd: WLL 0.33 - 55 t" }
      - { name: wmin, label: "WLL nhỏ nhất (tấn, để lọc)", widget: number, value_type: float, required: false, default: 0 }
      - { name: wmax, label: "WLL lớn nhất (tấn, để lọc)", widget: number, value_type: float, required: false, default: 0 }
      - { name: image, label: "Ảnh đại diện", widget: image, required: false, allow_multiple: false }
      - name: images
        label: "Thư viện ảnh (1–4 ảnh, ưu tiên hơn ảnh đại diện)"
        widget: list
        required: false
        field: { name: img, label: "Ảnh", widget: image }
      - name: catalogImages
        label: "Ảnh trang catalogue (số liệu kỹ thuật)"
        widget: list
        required: false
        media_folder: "/Du-an-web/04-Source/public/catalogs"
        public_folder: "/catalogs"
        field: { name: img, label: "Trang catalogue", widget: image }
      - { name: pdf, label: "pdf (không dùng)", widget: hidden, default: null }
      - { name: desc, label: "Mô tả (Description)", widget: text }
      - name: specs
        label: "Thông số kỹ thuật (Specifications)"
        widget: list
        required: false
        label_singular: "Thông số"
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { name: label, label: "Nhãn", widget: string }
          - { name: value, label: "Giá trị", widget: string }
      - name: standards
        label: "Tiêu chuẩn / chứng nhận"
        widget: list
        required: false
        field: { name: std, label: "Tiêu chuẩn", widget: string }
      - name: syn
        label: "Từ khóa tìm kiếm (tiếng Việt/Anh, không dấu)"
        widget: list
        required: false
        hint: "Giúp khách tìm bằng tiếng Việt, vd: ma ni, khoa ma ni"
        field: { name: term, label: "Từ khóa", widget: string }

  # ─────────────────────────────  CÀI ĐẶT  ─────────────────────────────
  - name: settings
    label: "Cài đặt"
    editor:
      preview: false
    files:
      - name: site
        label: "Site — Liên hệ / Menu / Footer"
        file: "Du-an-web/04-Source/content/settings/site.json"
        description: "Thông tin dùng chung toàn site: liên hệ, thanh menu, footer. Sửa 1 nơi, áp dụng mọi trang."
        fields:
          - name: company
            label: "Thông tin công ty"
            widget: object
            fields:
              - { name: name, label: "Tên công ty", widget: string }
              - { name: brandName, label: "Tên thương hiệu (chữ logo)", widget: string }
              - { name: brandTagline, label: "Dòng phụ dưới logo", widget: string }
              - { name: blurb, label: "Mô tả ngắn (footer)", widget: text }
              - { name: phone, label: "Điện thoại (hiển thị)", widget: string }
              - { name: phoneHref, label: "Điện thoại (dạng bấm gọi)", widget: string, hint: "định dạng quốc tế, vd: +842543512738" }
              - { name: fax, label: "Fax", widget: string, required: false }
              - { name: email, label: "Email", widget: string }
              - name: addressLines
                label: "Địa chỉ (mỗi mục 1 dòng)"
                widget: list
                field: { name: line, label: "Dòng địa chỉ", widget: string }
              - { name: addressInline, label: "Địa chỉ 1 dòng (footer + map)", widget: string }
              - { name: mapQuery, label: "Từ khóa Google Maps", widget: string, hint: "vd: 444A Binh Gia Street Tam Thang Ho Chi Minh City Vietnam" }
          - name: nav
            label: "Thanh menu (header)"
            widget: list
            summary: "{{fields.label}} → {{fields.href}}"
            fields:
              - { name: label, label: "Nhãn", widget: string }
              - { name: href, label: "Đường dẫn", widget: string }
          - name: headerCtas
            label: "Nút trên header"
            widget: object
            fields:
              - { name: wllLabel, label: "Nhãn nút công cụ tính cáp (Sling Calculation Tool)", widget: string }
              - { name: quoteLabel, label: "Nhãn nút Báo giá", widget: string }
              - { name: productsLabel, label: "Nhãn nút Tìm sản phẩm (Search Products)", widget: string }
          - name: footer
            label: "Footer"
            widget: object
            fields:
              - name: productLinks
                label: "Cột Products"
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: "Nhãn", widget: string }
                  - { name: href, label: "Đường dẫn", widget: string }
              - name: serviceLinks
                label: "Cột Services"
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: "Nhãn", widget: string }
                  - { name: href, label: "Đường dẫn", widget: string }
              - name: companyLinks
                label: "Cột Company"
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: "Nhãn", widget: string }
                  - { name: href, label: "Đường dẫn", widget: string }
              - name: bottomBar
                label: "Dòng chứng nhận (cuối trang)"
                widget: list
                field: { name: item, label: "Mục", widget: string }
              - { name: copyrightName, label: "Tên bản quyền", widget: string }
      - name: categories
        label: "Danh mục sản phẩm"
        file: "Du-an-web/04-Source/content/categories.json"
        fields:
          - name: categories
            label: "Danh mục"
            label_singular: "Danh mục"
            widget: list
            summary: "{{fields.label}}  (rank {{fields.rank}})"
            fields:
              - { name: id, label: "ID (slug, KHÔNG đổi)", widget: string, hint: "phải khớp categoryId của sản phẩm, vd: shackle" }
              - { name: label, label: "Tên hiển thị", widget: string }
              - { name: rank, label: "Thứ tự", widget: number, value_type: int, default: 99 }
              - { name: visible, label: "Hiển thị danh mục này", widget: boolean, default: true }
      - name: brands
        label: "Thương hiệu"
        file: "Du-an-web/04-Source/content/brands.json"
        description: "Danh sách thương hiệu để chọn khi thêm/sửa sản phẩm. Thêm/xóa ở đây; sản phẩm chọn từ danh sách này."
        fields:
          - name: brands
            label: "Thương hiệu"
            label_singular: "Thương hiệu"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: id, label: "ID (slug, KHÔNG đổi)", widget: string, hint: "vd: able, green-pin" }
              - { name: label, label: "Tên hiển thị (lưu vào sản phẩm)", widget: string }
              - { name: rank, label: "Thứ tự", widget: number, value_type: int, default: 99 }
              - { name: visible, label: "Hiển thị (dự phòng)", widget: boolean, default: true }

  # ─────────────────────────────  TRANG NỘI DUNG  ─────────────────────────────
  # Mỗi trang là 1 file. Chỉ sửa CHỮ — bố cục/màu giữ trong code. Icon SVG ở khối
  # "Services" trang chủ chọn bằng danh sách; màu thẻ danh mục nổi bật theo `id`.
  - name: pages
    label: "Trang (nội dung)"
    label_singular: "Trang"
    editor:
      preview: false
    files:
      # ── HOME ──
      - name: home
        label: "Trang chủ (Home)"
        file: "Du-an-web/04-Source/content/pages/home.json"
        fields:
          - name: hero
            label: "Hero (đầu trang)"
            widget: object
            fields:
              - { name: eyebrow, label: "Dòng nhỏ trên tiêu đề", widget: string }
              - { name: headlineTop, label: "Tiêu đề — dòng 1", widget: string }
              - { name: headlineBottom, label: "Tiêu đề — dòng 2 (màu teal)", widget: string }
              - { name: subhead, label: "Mô tả dưới tiêu đề", widget: text }
              - name: ctaPrimary
                label: "Nút chính"
                widget: object
                fields:
                  - { name: label, label: "Nhãn", widget: string }
                  - { name: href, label: "Đường dẫn", widget: string }
              - name: ctaSecondary
                label: "Nút phụ"
                widget: object
                fields:
                  - { name: label, label: "Nhãn", widget: string }
                  - { name: href, label: "Đường dẫn", widget: string }
              - name: features
                label: "Pills tính năng"
                widget: list
                summary: "{{fields.icon}} {{fields.text}}"
                fields:
                  - { name: icon, label: "Icon (emoji)", widget: string }
                  - { name: text, label: "Nội dung", widget: string }
          - name: stats
            label: "Dải số liệu"
            widget: list
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - { name: value, label: "Số", widget: string }
              - { name: label, label: "Nhãn", widget: string }
          - name: aboutTeaser
            label: "Khối About (giới thiệu ngắn)"
            widget: object
            fields:
              - { name: eyebrow, label: "Dòng nhỏ", widget: string }
              - { name: heading, label: "Tiêu đề", widget: string }
              - { name: body, label: "Nội dung", widget: text }
              - name: link
                label: "Link 'Learn more'"
                widget: object
                fields:
                  - { name: label, label: "Nhãn", widget: string }
                  - { name: href, label: "Đường dẫn", widget: string }
              - name: credentials
                label: "Thẻ chứng nhận"
                widget: list
                summary: "{{fields.code}} — {{fields.desc}}"
                fields:
                  - { name: code, label: "Mã (vd: DNV)", widget: string }
                  - { name: desc, label: "Mô tả", widget: string }
          - name: productsTeaser
            label: "Khối Products (danh mục nổi bật)"
            widget: object
            fields:
              - { name: eyebrow, label: "Dòng nhỏ", widget: string }
              - { name: heading, label: "Tiêu đề", widget: string }
              - name: highlights
                label: "Thẻ danh mục nổi bật (màu theo id — đừng đổi id)"
                widget: list
                summary: "{{fields.id}} — {{fields.desc}}"
                fields:
                  - { name: id, label: "ID danh mục (khớp categoryId)", widget: string }
                  - { name: desc, label: "Mô tả", widget: string }
              - name: brands
                label: "Danh sách thương hiệu"
                widget: list
                field: { name: brand, label: "Thương hiệu", widget: string }
          - name: servicesTeaser
            label: "Khối Services (dịch vụ ngắn)"
            widget: object
            fields:
              - { name: eyebrow, label: "Dòng nhỏ", widget: string }
              - { name: heading, label: "Tiêu đề", widget: string }
              - { name: subhead, label: "Mô tả", widget: text }
              - name: services
                label: "Thẻ dịch vụ"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: id, label: "ID", widget: string }
                  - name: iconKey
                    label: "Icon"
                    widget: select
                    options: ["spooling", "load-testing", "ndt"]
                  - { name: title, label: "Tiêu đề", widget: string }
                  - { name: desc, label: "Mô tả", widget: text }
                  - name: tags
                    label: "Nhãn (tags)"
                    widget: list
                    field: { name: tag, label: "Tag", widget: string }
              - { name: ctaLabel, label: "Nhãn nút 'View all'", widget: string }

      # ── ABOUT ──
      - name: about
        label: "Giới thiệu (About)"
        file: "Du-an-web/04-Source/content/pages/about.json"
        fields:
          - name: meta
            label: "SEO (tiêu đề trình duyệt)"
            widget: object
            fields:
              - { name: title, label: "Tiêu đề SEO", widget: string }
              - { name: description, label: "Mô tả SEO", widget: text }
          - name: hero
            label: "Hero"
            widget: object
            fields:
              - { name: eyebrow, label: "Dòng nhỏ", widget: string }
              - { name: headline, label: "Tiêu đề", widget: string }
              - { name: subhead, label: "Mô tả", widget: text }
              - name: image
                label: "Ảnh banner (nền hero)"
                widget: image
                required: false
                media_folder: "/Du-an-web/04-Source/public/banners"
                public_folder: "/banners"
                hint: "Ảnh nền phía sau tiêu đề. Nên dùng ảnh ngang, ≥1600px."
          - name: missionVision
            label: "Sứ mệnh & Tầm nhìn"
            widget: object
            fields:
              - { name: mission, label: "Sứ mệnh (Mission)", widget: text }
              - { name: vision, label: "Tầm nhìn (Vision)", widget: text }
          - name: story
            label: "Câu chuyện"
            widget: object
            fields:
              - { name: eyebrow, label: "Dòng nhỏ", widget: string }
              - { name: heading, label: "Tiêu đề", widget: string }
              - name: paragraphs
                label: "Đoạn văn"
                widget: list
                field: { name: p, label: "Đoạn", widget: text }
          - name: certificates
            label: "Chứng chỉ (Certificates)"
            widget: object
            hint: "Khu ảnh chứng chỉ hiển thị ngay dưới 'Câu chuyện'."
            fields:
              - { name: eyebrow, label: "Dòng nhỏ", widget: string }
              - { name: heading, label: "Tiêu đề", widget: string }
              - { name: note, label: "Ghi chú khi chưa có ảnh", widget: text }
              - name: items
                label: "Ảnh chứng chỉ"
                widget: list
                required: false
                label_singular: "Chứng chỉ"
                summary: "{{fields.title}}"
                media_folder: "/Du-an-web/04-Source/public/certificates"
                public_folder: "/certificates"
                fields:
                  - { name: image, label: "Ảnh chứng chỉ", widget: image }
                  - { name: title, label: "Tên chứng chỉ (tùy chọn)", widget: string, required: false }
          - name: credentials
            label: "Thẻ chứng nhận"
            widget: list
            summary: "{{fields.code}} — {{fields.label}}"
            fields:
              - { name: code, label: "Mã", widget: string }
              - { name: label, label: "Tên", widget: string }
              - { name: detail, label: "Chi tiết", widget: string }
          - name: values
            label: "Giá trị cốt lõi"
            widget: object
            fields:
              - { name: eyebrow, label: "Dòng nhỏ", widget: string }
              - { name: heading, label: "Tiêu đề", widget: string }
              - name: items
                label: "Các giá trị"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: "Tiêu đề", widget: string }
                  - { name: desc, label: "Mô tả", widget: text }
          - name: clients
            label: "Khách hàng tiêu biểu"
            widget: object
            fields:
              - { name: eyebrow, label: "Dòng nhỏ", widget: string }
              - { name: heading, label: "Tiêu đề", widget: string }
              - name: names
                label: "Tên khách hàng"
                widget: list
                field: { name: name, label: "Tên", widget: string }
          - name: cta
            label: "Khối kêu gọi (CTA)"
            widget: object
            fields:
              - { name: heading, label: "Tiêu đề", widget: string }
              - { name: body, label: "Nội dung", widget: text }
              - name: primary
                label: "Nút chính"
                widget: object
                fields:
                  - { name: label, label: "Nhãn", widget: string }
                  - { name: href, label: "Đường dẫn", widget: string }
              - name: secondary
                label: "Nút phụ"
                widget: object
                fields:
                  - { name: label, label: "Nhãn", widget: string }
                  - { name: href, label: "Đường dẫn", widget: string }

      # ── SERVICES ──
      - name: services
        label: "Dịch vụ (Services)"
        file: "Du-an-web/04-Source/content/pages/services.json"
        fields:
          - name: meta
            label: "SEO"
            widget: object
            fields:
              - { name: title, label: "Tiêu đề SEO", widget: string }
              - { name: description, label: "Mô tả SEO", widget: text }
          - name: hero
            label: "Hero"
            widget: object
            fields:
              - { name: eyebrow, label: "Dòng nhỏ", widget: string }
              - { name: headline, label: "Tiêu đề", widget: string }
              - { name: subhead, label: "Mô tả", widget: text }
          - name: stats
            label: "Dải số liệu năng lực"
            widget: list
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - { name: value, label: "Số", widget: string }
              - { name: label, label: "Nhãn", widget: string }
          - name: services
            label: "Danh sách dịch vụ"
            widget: list
            summary: "{{fields.icon}} {{fields.title}}"
            fields:
              - { name: id, label: "ID", widget: string }
              - { name: icon, label: "Icon (emoji)", widget: string }
              - { name: title, label: "Tiêu đề", widget: string }
              - { name: desc, label: "Mô tả", widget: text }
              - name: items
                label: "Gạch đầu dòng"
                widget: list
                field: { name: item, label: "Mục", widget: string }
              - name: tags
                label: "Nhãn (tags)"
                widget: list
                field: { name: tag, label: "Tag", widget: string }
              - name: images
                label: "Thư viện ảnh của dịch vụ này (nhiều ảnh)"
                widget: list
                required: false
                label_singular: "Ảnh"
                summary: "{{fields.caption}}"
                media_folder: "/Du-an-web/04-Source/public/gallery"
                public_folder: "/gallery"
                fields:
                  - { name: image, label: "Ảnh", widget: image }
                  - { name: caption, label: "Chú thích (tùy chọn)", widget: string, required: false }
          - name: facility
            label: "Nhà xưởng & thiết bị"
            widget: object
            fields:
              - { name: eyebrow, label: "Dòng nhỏ", widget: string }
              - { name: heading, label: "Tiêu đề", widget: string }
              - name: paragraphs
                label: "Đoạn văn"
                widget: list
                field: { name: p, label: "Đoạn", widget: text }
              - name: equipment
                label: "Thiết bị"
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Tên", widget: string }
                  - { name: detail, label: "Chi tiết", widget: string }
          - name: gallery
